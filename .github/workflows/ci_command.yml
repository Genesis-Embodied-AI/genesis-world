name: CI Command

# A comment '/ci' on a pull request, or marking it ready for review, re-runs its workflows that skipped the latest
# commit for being a draft (see the production workflow). A workflow that tested the commit already is never run again,
# since each run of the whole CI is expensive. The re-run keeps the event and permissions of the pull request, so this
# workflow, which runs from the default branch with a write token, never checks out the code of the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [ready_for_review]
    branches:
      - main

permissions:
  actions: write
  issues: write
  # Reacting to a comment on a pull request takes write access to pull requests on top of issues.
  pull-requests: write

jobs:
  rerun:
    name: ci-command-rerun

    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
        && (github.event.comment.body == '/ci' || startsWith(github.event.comment.body, '/ci ')))

    runs-on: ubuntu-24.04

    # Two commands on one pull request would re-run the same runs, so the second one waits for the first, then finds
    # nothing left to re-run. The group is set on the job, so that the other comments, whose job is skipped, never
    # cancel a pending command.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}

    steps:
      - name: Re-run the skipped workflows of the pull request
        uses: actions/github-script@v8
        env:
          PRECOMMIT_WORKFLOW: .github/workflows/format.yml
          NYX_WORKFLOW: nyx_plugin.yml
          NYX_RUN_NAME: Nyx Plugin
          NYX_TESTS_JOB: nyx_plugin-unit_tests
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            // Marking a pull request ready for review leaves no comment to react to.
            const react = async (content) => {
              if (comment) {
                await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: comment.id, content });
              }
            };

            // Marking a pull request ready for review starts the same CI as a push to a ready one, so it asks for no
            // permission. The association of a comment misses the members of the organization whose membership is
            // private, so the permission is asked of the API instead.
            if (comment) {
              const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: comment.user.login,
              });
              if (!['admin', 'write'].includes(access.permission)) {
                core.notice(`${comment.user.login} has no write access, so the command is ignored.`);
                await react('-1');
                return;
              }
            }

            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: context.issue.number });
            if (!comment && pull.draft) {
              core.notice('The pull request went back to draft before its workflows could be re-run.');
              return;
            }
            // The gated workflows run for pull requests toward the default branch alone.
            if (pull.base.ref !== context.payload.repository.default_branch) {
              core.notice(`The pull request targets '${pull.base.ref}', which runs no gated workflow.`);
              await react('confused');
              return;
            }
            // The runs of the commit may not exist yet right after a push, and a run can be re-run only once completed,
            // so they are polled until they settle. The precommit run is never gated, so its presence shows that the
            // push created its runs. A run re-run already, by hand or by an earlier command, is never waited for, and
            // neither is a run testing the commit, started while the pull request was ready for review. The gate
            // skips the first job of a gated run as soon as the run starts, so a run with a job started or completed
            // otherwise is testing the commit. A queued job tells nothing, since the jobs that follow a skipped one
            // through 'needs' are queued until skipped in turn. The bound of 30 minutes is far above the lint duration.
            const isTesting = (job) => job.status === 'in_progress'
              || (job.status === 'completed' && job.conclusion !== 'skipped');
            const nyxRunName = `${process.env.NYX_RUN_NAME} ${pull.head.sha}`;
            let runsLatest = [];
            let runPrecommit = undefined;
            let runNyx = undefined;
            let jobNyxTests = undefined;
            let isSettled = false;
            for (let i_poll = 0; i_poll < 180; i_poll++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'pull_request', head_sha: pull.head.sha,
              });
              // A run lists no pull request when it comes from a fork, so it is matched to the pull request through
              // its head branch, since other branches may point at the same commit. A commit can have several runs of
              // a workflow, one per event of its pull request. The runs are listed newest first, and the latest one of
              // each workflow alone is considered.
              const runsPull = runs.filter((run) => run.head_branch === pull.head.ref
                && run.head_repository.full_name === pull.head.repo.full_name);
              runsLatest = runsPull.filter(
                (run, i_run) => runsPull.findIndex(({ path }) => path === run.path) === i_run);
              runPrecommit = runsLatest.find((run) => run.path === process.env.PRECOMMIT_WORKFLOW);
              isSettled = runPrecommit !== undefined
                && (runPrecommit.status === 'completed' || runPrecommit.run_attempt > 1);
              for (const run of runsLatest) {
                if (!isSettled) {
                  break;
                }
                if (run.status === 'completed' || run.conclusion === 'action_required' || run.run_attempt > 1) {
                  continue;
                }
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id,
                });
                isSettled = jobs.some(isTesting);
              }
              // The Nyx Plugin run that the completion of the first precommit run starts decides on its gate when its
              // test job starts, from the draft flag the API reports then, so that run is found through its name (see
              // that workflow) and waited for until it has decided. It is created within seconds of that completion,
              // so a minute later, a first precommit run with no Nyx Plugin run of that name is re-run as if the run
              // had skipped its tests.
              runNyx = undefined;
              jobNyxTests = undefined;
              if (isSettled && runPrecommit.run_attempt === 1) {
                const runsNyx = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id: process.env.NYX_WORKFLOW, event: 'workflow_run',
                  created: `>=${runPrecommit.created_at}`,
                });
                runNyx = runsNyx.find((run) => run.display_title === nyxRunName);
                if (runNyx === undefined) {
                  isSettled = runPrecommit.status === 'completed'
                    && Date.now() - Date.parse(runPrecommit.updated_at) > 60000;
                } else if (runNyx.run_attempt === 1) {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    owner, repo, run_id: runNyx.id,
                  });
                  jobNyxTests = jobs.find((job) => job.name === process.env.NYX_TESTS_JOB);
                  isSettled = runNyx.status === 'completed' || (jobNyxTests !== undefined && isTesting(jobNyxTests));
                }
              }
              if (isSettled) {
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            if (!isSettled) {
              await react('confused');
              core.setFailed(`The runs of ${pull.head.sha} did not complete in time. Comment /ci once they do.`);
              return;
            }
            // A run from a fork that needs a maintainer's approval waits as 'action_required', and is approved on the
            // pull request page before '/ci' can re-run it. Once approved, it still carries the draft event and skips.
            if (runsLatest.some((run) => run.conclusion === 'action_required')) {
              await react('confused');
              core.setFailed('The workflows of the pull request wait for approval. Approve them, then comment /ci.');
              return;
            }
            // A run skips as a whole only through a draft gate (see the production workflow). Re-running the precommit
            // run starts a Nyx Plugin run past its draft gate (see that workflow).
            const isNyxSkipped = runPrecommit.run_attempt === 1 && (runNyx === undefined
              || (runNyx.run_attempt === 1 && jobNyxTests !== undefined && jobNyxTests.conclusion === 'skipped'));
            const runsRerun = runsLatest.filter((run) => run.conclusion === 'skipped' && run.run_attempt === 1);
            if (isNyxSkipped) {
              runsRerun.push(runPrecommit);
            }
            if (runsRerun.length === 0) {
              core.notice(`Commit ${pull.head.sha} has no skipped run to re-run.`);
              await react('confused');
              return;
            }
            // A push while the runs were polled starts the CI of the new commit, which a re-run of the previous commit
            // would cancel, its runs sharing the concurrency groups of the pull request.
            const { data: pullLatest } = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
            if (pullLatest.head.sha !== pull.head.sha) {
              core.notice(`Commit ${pullLatest.head.sha} replaced ${pull.head.sha}, which is left untested.`);
              await react('confused');
              return;
            }
            for (const run of runsRerun) {
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: run.id });
              core.notice(`Re-running ${run.html_url}`);
            }
            await react('rocket');
