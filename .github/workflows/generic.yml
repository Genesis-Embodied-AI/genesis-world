name: Generic

on:
  pull_request:
    branches:
      - main
  release:
    branches:
      - main
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generic-cpu:
    name: ${{ matrix.OS }}-${{ matrix.PYTHON_VERSION }}-${{ matrix.GS_BACKEND }}-${{ matrix.GS_ENABLE_NDARRAY == '0' && 'field' || 'ndarray' }}

    strategy:
      fail-fast: false
      matrix:
        # See official Github documentation for details: https://shorturl.at/NJgsj
        OS: ["ubuntu-24.04", "macos-15"]
        PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
        GS_BACKEND: ["cpu"]
        GS_ENABLE_NDARRAY: ["1"]
        include:
          # CPU backend - dynamic array (other OSes)
          - OS: "ubuntu-22.04"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "1"
          - OS: "ubuntu-24.04-arm"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "1"
          - OS: "windows-2025"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "1"
          # CPU backend - field array
          - OS: "ubuntu-24.04"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "0"
          - OS: "ubuntu-24.04-arm"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "0"
          # FIXME: Quadrants compilation is taking so slow on Windows that running the unit tests
          # for static arrays takes about 400min, which is not acceptable. Disabling for now.
          # - OS: "windows-2025"
          #   PYTHON_VERSION: "3.12"
          #   GS_BACKEND: "cpu"
          #   GS_ENABLE_NDARRAY: "0"
          - OS: "macos-15"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "cpu"
            GS_ENABLE_NDARRAY: "0"
          # GPU backend - field array
          - OS: "macos-15"
            PYTHON_VERSION: "3.12"
            GS_BACKEND: "gpu"
            GS_ENABLE_NDARRAY: "1"

    env:
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      FORCE_COLOR: "1"
      PY_COLORS: "1"
      GS_ENABLE_NDARRAY: ${{ matrix.GS_ENABLE_NDARRAY }}
      GS_TORCH_FORCE_CPU_DEVICE: ${{ startsWith(matrix.OS, 'macos-') && '1' || '0' }}
      QD_OFFLINE_CACHE: "1"
      QD_OFFLINE_CACHE_CLEANING_POLICY: "never"
      QD_ENABLE_CUDA: ${{ matrix.GS_BACKEND == 'gpu' && '1' || '0' }}
      QD_ENABLE_AMDGPU: ${{ matrix.GS_BACKEND == 'gpu' && '1' || '0' }}
      QD_ENABLE_METAL: ${{ matrix.GS_BACKEND == 'gpu' && '1' || '0' }}
      QD_DEBUG: "0"
      OMNI_KIT_ACCEPT_EULA: "yes"

    runs-on: ${{ matrix.OS }}
    if: github.event_name != 'release'

    steps:
      - name: Print system information (Windows)
        if: startsWith(matrix.OS, 'windows-')
        shell: pwsh
        run: |
          $cpu = Get-CimInstance -ClassName Win32_Processor
          $ram = Get-CimInstance -ClassName Win32_ComputerSystem
          [PSCustomObject]@{
              CPU_Name                 = $cpu.Name
              Physical_Cores           = ($cpu | Measure-Object -Property NumberOfCores -Sum).Sum
              Logical_Processors       = ($cpu | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum
              Total_RAM_GB             = [math]::Round($ram.TotalPhysicalMemory / 1GB, 2)
          }

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.PYTHON_VERSION }}

      - name: Install system dependencies (Windows)
        if: startsWith(matrix.OS, 'windows-')
        shell: bash
        run: |
          curl -L -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/25.1.5/mesa3d-25.1.5-release-msvc.7z
          7z x mesa.7z -omesa
          mv -v mesa/x64/* /C/Windows/System32/

      - name: Install Mesa OpenGL driver (Linux)
        if: startsWith(matrix.OS, 'ubuntu-')
        run: |
          for retry in {1..10}; do
            sudo add-apt-repository -y ppa:kisak/kisak-mesa && break || sleep 5;
          done
          sudo apt install -y \
              libglu1-mesa \
              libegl-mesa0 \
              libgl1-mesa-dev
      - name: Install python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools pkg-info wheel

          # FIXME: Must install torch>2.9.1 to support zerocopy on Apple Metal
          TORCH_SPEC="torch"
          if [[ "${{ matrix.OS }}" == macos-* ]] ; then
            # FIXME: quadrants#1017 - Quadrants Metal interop crashes without Torch MPS device, which torch>=2.15 no
            # longer exposes on the virtualized GPU of macOS runners.
            TORCH_SPEC="torch<2.15"
          fi
          pip3 install "${TORCH_SPEC}" --upgrade --index-url https://download.pytorch.org/whl/cpu
      - name: Install Genesis
        shell: bash
        run: |
          PYTHON_DEPS="dev,render"
          # Install USD for all platforms except ARM (usd-core doesn't support ARM)
          # This is required for test_mesh.py which tests USD parsing functionality
          if [[ "${{ matrix.OS }}" != 'ubuntu-24.04-arm' ]] ; then
            PYTHON_DEPS="${PYTHON_DEPS},usd"
          fi
          pip install ".[${PYTHON_DEPS}]"

          # FIXME: matplotlib 3.11.0 changed text rasterization, breaking the MPLPlotter PNG snapshot
          # (test_recorders.py::test_plotter). Pin below 3.11 until the snapshot is regenerated.
          pip install "matplotlib<3.11"

      - name: Run unit tests
        run: |
          pytest -v -ra --logical ${{ matrix.GS_ENABLE_NDARRAY != '0' && '--dev' || '' }} --backend ${{ matrix.GS_BACKEND }} -m 'required and not slow' --forked --failure-artifacts-dir "${{ runner.temp }}/failure_artifacts" ./tests

      # The image a mismatching snapshot test rendered
      - name: Upload the artifacts of the failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.OS }}-${{ matrix.PYTHON_VERSION }}-${{ matrix.GS_BACKEND }}-${{ matrix.GS_ENABLE_NDARRAY == '0' && 'field' || 'ndarray' }}
          path: ${{ runner.temp }}/failure_artifacts
          if-no-files-found: ignore

  publish-pypi:
    name: Publish on PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    environment:
      name: advance

    if: github.event_name == 'release'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build wheels
        run: |
          pip wheel --no-deps . -w wheelhouse

      - name: Publish the wheels on PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: wheelhouse
          verify-metadata: true
          attestations: true
          print-hash: true
          skip-existing: true
